<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="15" font-weight="700" fill="#111827">1층. 시스템 맥락</text>

  <!-- 러너 -->
  <rect x="24" y="132" width="150" height="76" rx="38" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="99" y="164" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">러너</text>
  <text x="99" y="184" font-size="11" text-anchor="middle" fill="#6b7280">사람</text>

  <!-- 치어러너 -->
  <rect x="316" y="126" width="188" height="88" rx="8" fill="#1270b0" stroke="#0d5688" stroke-width="1.5"/>
  <text x="410" y="160" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">치어러너</text>
  <text x="410" y="181" font-size="11" text-anchor="middle" fill="#f7d9d2">소프트웨어 시스템</text>
  <text x="410" y="198" font-size="11" text-anchor="middle" fill="#f7d9d2">거리 측정과 지점 응원</text>

  <!-- 외부 시스템 -->
  <rect x="656" y="42" width="220" height="66" rx="4" fill="#eef1f5" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="766" y="70" font-size="14" font-weight="600" text-anchor="middle" fill="#111827">기기 위치 서비스</text>
  <text x="766" y="90" font-size="11" text-anchor="middle" fill="#6b7280">외부 시스템</text>

  <rect x="656" y="137" width="220" height="66" rx="4" fill="#eef1f5" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="766" y="165" font-size="14" font-weight="600" text-anchor="middle" fill="#111827">기기 음성 합성</text>
  <text x="766" y="185" font-size="11" text-anchor="middle" fill="#6b7280">외부 시스템</text>

  <rect x="656" y="232" width="220" height="66" rx="4" fill="#eef1f5" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="766" y="260" font-size="14" font-weight="600" text-anchor="middle" fill="#111827">지도 이미지 서비스</text>
  <text x="766" y="280" font-size="11" text-anchor="middle" fill="#6b7280">외부 시스템</text>

  <!-- 러너 -> 치어러너 -->
  <path d="M170 152 H312" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="243" y="143" font-size="11" text-anchor="middle" fill="#374151">달린다, 지점을 지정한다</text>

  <!-- 치어러너 -> 러너 -->
  <path d="M312 190 H172" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="243" y="206" font-size="11" text-anchor="middle" fill="#374151">응원 음성</text>

  <!-- 치어러너 -> 외부 -->
  <path d="M430 126 V75 H652" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="545" y="66" font-size="11" text-anchor="middle" fill="#374151">위치 구독</text>

  <path d="M504 170 H652" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="578" y="162" font-size="11" text-anchor="middle" fill="#374151">음성 출력 요청</text>

  <path d="M430 214 V265 H652" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="545" y="256" font-size="11" text-anchor="middle" fill="#374151">지도 이미지 요청</text>

  <text x="20" y="336" font-size="11" fill="#6b7280">외부 셋 중 위치 서비스만 되돌리기 어려운 의존이다. 음성과 지도는 없어도 성립하지만 위치가 없으면 도메인이 성립하지 않는다.</text>
</svg>
