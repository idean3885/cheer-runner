<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="15" font-weight="700" fill="#111827">2층. 컨테이너</text>
  <text x="20" y="50" font-size="11" fill="#6b7280">컨테이너는 따로 배포되는 실행 단위다. 도커 컨테이너가 아니다.</text>

  <!-- 러너 -->
  <rect x="265" y="70" width="150" height="60" rx="30" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="340" y="96" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">러너</text>
  <text x="340" y="114" font-size="11" text-anchor="middle" fill="#6b7280">사람</text>

  <!-- 시스템 경계 -->
  <rect x="60" y="180" width="560" height="300" rx="8" fill="none" stroke="#1270b0" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="76" y="202" font-size="12" font-weight="700" fill="#1270b0">치어러너 [소프트웨어 시스템]</text>

  <!-- 모바일앱 -->
  <rect x="225" y="220" width="230" height="88" rx="6" fill="#ffffff" stroke="#1270b0" stroke-width="1.8"/>
  <text x="340" y="250" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">모바일앱</text>
  <text x="340" y="269" font-size="11" text-anchor="middle" fill="#6b7280">Expo React Native</text>
  <text x="340" y="290" font-size="11" text-anchor="middle" fill="#374151">배경에서 위치를 받고 응원</text>

  <!-- 기기 저장 -->
  <g>
    <path d="M258 376 L258 442 A 82 18 0 0 0 422 442 L422 376 Z" fill="#ffffff" stroke="#1270b0" stroke-width="1.8"/>
    <ellipse cx="340" cy="376" rx="82" ry="18" fill="#ffffff" stroke="#1270b0" stroke-width="1.8"/>
    <text x="340" y="414" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">기기 저장</text>
    <text x="340" y="433" font-size="11" text-anchor="middle" fill="#374151">코스, 보관함, 궤적, 기록</text>
  </g>

  <!-- 외부 -->
  <rect x="736" y="210" width="230" height="60" rx="4" fill="#eef1f5" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="851" y="235" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">기기 위치 서비스</text>
  <text x="851" y="254" font-size="11" text-anchor="middle" fill="#6b7280">외부 시스템</text>

  <rect x="736" y="298" width="230" height="60" rx="4" fill="#eef1f5" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="851" y="323" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">기기 음성 합성</text>
  <text x="851" y="342" font-size="11" text-anchor="middle" fill="#6b7280">외부 시스템</text>

  <rect x="736" y="386" width="230" height="60" rx="4" fill="#eef1f5" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="851" y="411" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">기기 지도</text>
  <text x="851" y="430" font-size="11" text-anchor="middle" fill="#6b7280">외부 시스템</text>

  <!-- 러너 -> 앱 -->
  <path d="M340 130 V216" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="350" y="178" font-size="11" fill="#374151">달린다</text>

  <!-- 앱 -> 저장 -->
  <path d="M340 308 V354" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="350" y="336" font-size="11" fill="#374151">읽고 쓴다</text>

  <!-- 앱 -> 위치 -->
  <path d="M455 240 H732" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="678" y="232" font-size="11" text-anchor="middle" fill="#374151">위치 구독</text>

  <!-- 앱 -> 음성 -->
  <path d="M455 266 H610 V328 H732" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="678" y="320" font-size="11" text-anchor="middle" fill="#374151">음성·알림음</text>

  <!-- 앱 -> 지도 -->
  <path d="M455 292 H540 V416 H732" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="678" y="408" font-size="11" text-anchor="middle" fill="#374151">지도 표시</text>

  <text x="20" y="502" font-size="11" fill="#6b7280">배포되는 것은 모바일앱 하나다. 서버가 없어서가 아니라 이 도메인에 서버가 필요하지 않기 때문이다. 웹 프로토타입은 앱 시험이 같은 판정을 낸 뒤 걷었다.</text>
</svg>
