<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="1000" height="580" fill="#ffffff"/>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="15" font-weight="700" fill="#111827">2층. 컨테이너</text>
  <text x="20" y="50" font-size="11" fill="#6b7280">컨테이너는 따로 배포되는 실행 단위다. 도커 컨테이너가 아니다.</text>

  <!-- 러너 -->
  <rect x="366" y="70" width="150" height="60" rx="30" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="441" y="96" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">러너</text>
  <text x="441" y="114" font-size="11" text-anchor="middle" fill="#6b7280">사람</text>

  <!-- 시스템 경계 -->
  <rect x="36" y="182" width="560" height="312" rx="8" fill="none" stroke="#c4452b" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="52" y="204" font-size="12" font-weight="700" fill="#c4452b">치어러너 [소프트웨어 시스템]</text>

  <!-- 모바일앱 -->
  <rect x="330" y="222" width="234" height="82" rx="6" fill="#ffffff" stroke="#c4452b" stroke-width="1.8"/>
  <text x="447" y="250" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">모바일앱</text>
  <text x="447" y="269" font-size="11" text-anchor="middle" fill="#6b7280">Expo React Native</text>
  <text x="447" y="288" font-size="11" text-anchor="middle" fill="#374151">배경에서 위치를 받고 응원</text>

  <!-- 웹 프로토타입 -->
  <rect x="66" y="222" width="234" height="82" rx="6" fill="#ffffff" stroke="#c4452b" stroke-width="1.8"/>
  <text x="183" y="250" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">웹 프로토타입</text>
  <text x="183" y="269" font-size="11" text-anchor="middle" fill="#6b7280">단일 HTML</text>
  <text x="183" y="288" font-size="11" text-anchor="middle" fill="#374151">로직 확인. 배경 위치 불가</text>

  <!-- 배포 함수 -->
  <rect x="66" y="386" width="182" height="72" rx="6" fill="#ffffff" stroke="#c4452b" stroke-width="1.8"/>
  <text x="157" y="414" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">배포 함수</text>
  <text x="157" y="433" font-size="11" text-anchor="middle" fill="#6b7280">서버리스 함수</text>
  <text x="157" y="450" font-size="11" text-anchor="middle" fill="#374151">버전 알림, 로그 수집</text>

  <!-- 기기 저장 -->
  <g>
    <path d="M342 386 L342 452 A 82 18 0 0 0 506 452 L506 386 Z" fill="#ffffff" stroke="#c4452b" stroke-width="1.8"/>
    <ellipse cx="424" cy="386" rx="82" ry="18" fill="#ffffff" stroke="#c4452b" stroke-width="1.8"/>
    <text x="424" y="424" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">기기 저장</text>
    <text x="424" y="443" font-size="11" text-anchor="middle" fill="#374151">코스, 궤적, 진단 기록</text>
  </g>

  <!-- 외부 -->
  <rect x="736" y="222" width="230" height="60" rx="4" fill="#eef1f5" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="851" y="247" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">기기 위치 서비스</text>
  <text x="851" y="266" font-size="11" text-anchor="middle" fill="#6b7280">외부 시스템</text>

  <rect x="736" y="310" width="230" height="60" rx="4" fill="#eef1f5" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="851" y="335" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">기기 음성 합성</text>
  <text x="851" y="354" font-size="11" text-anchor="middle" fill="#6b7280">외부 시스템</text>

  <rect x="736" y="398" width="230" height="60" rx="4" fill="#eef1f5" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="851" y="423" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">기기 지도</text>
  <text x="851" y="442" font-size="11" text-anchor="middle" fill="#6b7280">외부 시스템</text>

  <!-- 러너 -> 앱 / 웹 -->
  <path d="M470 130 V218" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="480" y="178" font-size="11" fill="#374151">달린다</text>

  <path d="M366 100 H183 V218" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="272" y="92" font-size="11" text-anchor="middle" fill="#374151">로직을 확인한다</text>

  <!-- 앱 -> 저장 -->
  <path d="M424 304 V364" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="434" y="344" font-size="11" fill="#374151">읽고 쓴다</text>

  <!-- 웹 -> 저장 -->
  <path d="M240 304 V340 H390 V366" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="300" y="333" font-size="11" fill="#374151">읽고 쓴다</text>

  <!-- 웹 -> 배포 함수 -->
  <path d="M157 304 V382" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="167" y="340" font-size="11" fill="#374151">버전 조회</text>
  <text x="167" y="356" font-size="11" fill="#374151">로그 전송</text>

  <!-- 앱 -> 위치 -->
  <path d="M564 252 H732" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="648" y="244" font-size="11" text-anchor="middle" fill="#374151">위치 구독</text>

  <!-- 앱 -> 음성 -->
  <path d="M564 288 H650 V340 H732" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="644" y="280" font-size="11" text-anchor="end" fill="#374151">음성 출력</text>

  <!-- 앱 -> 지도 -->
  <path d="M564 270 H600 V414 H732" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="612" y="406" font-size="11" fill="#374151">지도 표시</text>

  <!-- 웹 -> 지도 이미지 (아래로 우회) -->
  <path d="M270 304 L270 522 L700 522 L700 434 L732 434" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="470" y="516" font-size="11" text-anchor="middle" fill="#374151">지도 이미지 요청</text>

  <text x="20" y="562" font-size="11" fill="#6b7280">컨테이너 넷의 근거는 따로 배포되기 때문이다. 웹도 위치를 구독하지만 화면이 켜진 동안만 받는다.</text>
</svg>
