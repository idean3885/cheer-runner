<!--
  치어러너 앱 아이콘.

  모서리를 둥글게 깎지 않는다. iOS 와 안드로이드가 자기 마스크를 씌우므로,
  여기서 미리 깎으면 모서리가 두 번 깎여 투명한 틈이 생긴다.

  구성: 뒤로 흘러내리는 바람 · 목표를 향해 기운 러너 · 앞에 선 지점 깃발
  색은 잠정값이다 (육상 트랙 적갈색).
-->
